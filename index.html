<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#180a06" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#180a06" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Stratos — hệ sinh thái cá nhân: ghi chú, công việc, thời gian, KPI và chi tiêu." />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="application-name" content="Stratos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stratos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@500..700&display=swap"
    />
    <title>Stratos</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('nm.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('nm.skin');
        if (s && /^(f1|z-[a-z]+)$/.test(s)) document.documentElement.dataset.skin = s;
        // Desktop sidebar collapsed to an icon rail (shell.js) — also before paint.
        if (localStorage.getItem('nm.sidebar') === 'rail') document.documentElement.dataset.sidebar = 'rail';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <span class="boot__mark">N</span>
        <span class="boot__line"></span>
      </div>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
