# Kiểm tra mọi Pull Request (và được deploy.yml gọi lại trước khi deploy).
# Không cần secret: web build dùng biến public, database chạy Supabase local bằng Docker.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chặn secret lọt vào biến VITE_*
        run: node .github/scripts/check-public-env.mjs

      - name: Unit + database tests (vitest, PGlite)
        run: npm test

      - run: npm run build

  database:
    name: Database migrations (local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # Dựng Postgres + Auth local và áp dụng TOÀN BỘ supabase/migrations theo thứ tự.
      # Migration lỗi → job đỏ, không bao giờ tới production.
      - name: Apply migrations on a fresh local database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --fail-on error

      # Service layer chạy thật qua supabase-js → Auth (GoTrue) + PostgREST + Postgres local.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Auth + REST on top of the local database
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,mailpit,postgres-meta,supavisor

      # Chỉ để chẩn đoán: in tên các khoá mà `supabase status` trả về (không in giá trị).
      - name: Show local Supabase status keys
        continue-on-error: true
        run: supabase status -o json 2>&1 | grep -o '"[A-Z_]*":' || true

      # Stack local dùng JWT secret mặc định (config.toml không đổi) → URL và anon/service key
      # là giá trị demo công khai của Supabase CLI, không phải secret. Đặt thẳng để test không
      # phụ thuộc định dạng output của `supabase status` (khác nhau giữa các bản CLI).
      - name: Integration tests (real Supabase stack)
        env:
          IT_SUPABASE_URL: http://127.0.0.1:54321
          IT_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          IT_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        run: npm run test:integration

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
