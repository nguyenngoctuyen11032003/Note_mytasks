# Kiểm tra mọi Pull Request (và được deploy.yml gọi lại trước khi deploy).
# Không cần secret: web build dùng biến public, database chạy Supabase local bằng Docker.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chặn secret lọt vào biến VITE_*
        run: node .github/scripts/check-public-env.mjs

      - name: Unit + database tests (vitest, PGlite)
        run: npm test

      - run: npm run build

  database:
    name: Database migrations (local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # Dựng Postgres + Auth local và áp dụng TOÀN BỘ supabase/migrations theo thứ tự.
      # Migration lỗi → job đỏ, không bao giờ tới production.
      - name: Apply migrations on a fresh local database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --fail-on error

      # Service layer chạy thật qua supabase-js → Auth (GoTrue) + PostgREST + Postgres local.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Auth + REST on top of the local database
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,mailpit,postgres-meta,supavisor

      # Lấy URL/key từ chính CLI đã cài ở trên (npx supabase sẽ tải bản khác, định dạng status khác).
      - name: Export local Supabase credentials
        run: |
          supabase status -o json > "$RUNNER_TEMP/sb-status.json"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const url = s.API_URL, anon = s.ANON_KEY, service = s.SERVICE_ROLE_KEY;
            if (!url || !anon || !service) { console.error("supabase status thiếu khoá:", Object.keys(s)); process.exit(1); }
            for (const k of [anon, service]) console.log(`::add-mask::${k}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `IT_SUPABASE_URL=${url}\nIT_ANON_KEY=${anon}\nIT_SERVICE_KEY=${service}\n`);
          ' "$RUNNER_TEMP/sb-status.json"

      - name: Integration tests (real Supabase stack)
        run: npm run test:integration

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
