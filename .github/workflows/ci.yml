# Kiểm tra mọi Pull Request (và được deploy.yml gọi lại trước khi deploy).
# Push lên main không có trigger riêng ở đây: deploy.yml (on push main) gọi workflow này
# qua workflow_call; thêm `push` sẽ chạy CI hai lần cho mỗi commit.
# Không cần secret: web build dùng biến public, database chạy Supabase local bằng Docker.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chặn secret lọt vào biến VITE_*
        run: node .github/scripts/check-public-env.mjs

      - name: Unit + database tests (vitest, PGlite)
        run: npm test

      - run: npm run build

  functions:
    name: Edge Functions type-check (Deno)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true
          # Chưa có deno.lock → khoá cache theo mã nguồn function.
          cache-hash: ${{ hashFiles('supabase/functions/**/*.ts') }}

      # Unit test của lib.ts chạy trong `npm test` (vitest); job này bắt lỗi kiểu/import
      # phía Deno (npm: specifier, Deno.* API) mà vitest không thấy.
      - name: Type-check every function entrypoint
        # --node-modules-dir=none: root package.json would otherwise make Deno
        # expect a node_modules/ with the npm: deps (not installed in this job).
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  database:
    name: Database migrations (local)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # Dựng Postgres + Auth + REST + Storage local và áp dụng TOÀN BỘ supabase/migrations theo thứ tự.
      # Migration lỗi → job đỏ, không bao giờ tới production.
      # Phải là `supabase start` ngay từ đầu: nếu chạy `db start` trước thì `start` sau đó
      # coi stack là "đã chạy" và không bật Auth/REST/API gateway.
      - name: Apply migrations on a fresh local stack (Postgres + Auth + REST + Storage)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,mailpit,postgres-meta,supavisor

      - name: Lint database schema
        run: supabase db lint --fail-on error

      # Service layer chạy thật qua supabase-js → Auth (GoTrue) + PostgREST + Postgres local.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Wait for local API gateway
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54321/rest/v1/ || true)
            [ "$code" != "000" ] && exit 0
            sleep 2
          done
          echo "::error::Local Supabase API (127.0.0.1:54321) is not responding"
          supabase status || true
          exit 1

      # Stack local dùng JWT secret mặc định (config.toml không đổi) → URL và anon/service key
      # là giá trị demo công khai của Supabase CLI, không phải secret. Đặt thẳng để test không
      # phụ thuộc định dạng output của `supabase status` (khác nhau giữa các bản CLI).
      - name: Integration tests (real Supabase stack)
        env:
          IT_SUPABASE_URL: http://127.0.0.1:54321
          IT_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          IT_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        run: npm run test:integration

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
