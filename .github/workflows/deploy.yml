# Production: push lên main → CI → (migration Supabase nếu có thay đổi)
#   → (deploy Edge Functions nếu supabase/functions/** đổi) song song với build → GitHub Pages.
#
# AN TOÀN DATABASE: project Supabase dùng chung với app khác. Workflow này CHỈ chạy
# `supabase db push` (thêm migration chưa áp dụng). Không bao giờ reset / drop /
# `config push` / seed / supabase/maintenance/*.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Chạy bước migration Supabase kể cả khi không có file migration mới
        type: boolean
        default: false
      functions:
        description: Deploy mọi Edge Function kể cả khi supabase/functions không đổi
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect migration / function changes
    runs-on: ubuntu-24.04
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
      functions: ${{ steps.diff.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.migrate }}
          FORCE_FUNCTIONS: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # changed <path>: "true" nếu path đổi giữa BEFORE..AFTER (hoặc không so được).
          changed() {
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]                || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo true   # nhánh mới / force-push: không so được → kiểm tra (db push tự bỏ qua nếu không có gì mới)
            elif git diff --quiet "$BEFORE" "$AFTER" -- "$1"; then
              echo false
            else
              echo true
            fi
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            migrations="$FORCE"
            functions="$FORCE_FUNCTIONS"
          else
            migrations=$(changed supabase/migrations)
            functions=$(changed supabase/functions)
          fi
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"
          echo "Migration step: $migrations"
          echo "Functions step: $functions"

  migrate:
    name: Supabase db push
    needs: [verify, changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Tạo environment "production" trong GitHub và bật "Required reviewers"
    # để mỗi lần đổi database phải bấm duyệt.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Check required secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu $v"; missing=1; fi
          done
          exit $missing

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview migrations to apply
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes

  functions:
    name: Supabase functions deploy
    needs: [verify, changes, migrate]
    # Sau migrate (function gọi RPC fit_ai_quota_consume): chạy khi migrate thành công
    # hoặc được bỏ qua. Không chặn build/pages: site Note_mytasks không dùng function này.
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.functions == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Check required secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu $v"; missing=1; fi
          done
          exit $missing

      # verify_jwt lấy từ [functions.fitora-food-ai] trong supabase/config.toml.
      # Secrets của function (ANTHROPIC_API_KEY, …) đặt một lần bằng `supabase secrets set`, xem docs/DEPLOY.md.
      # Không truyền tên → deploy MỌI function trong supabase/functions (hiện có fitora-food-ai),
      # để function thêm sau này không bị bỏ sót.
      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

  build:
    name: Build site
    needs: [verify, changes, migrate]
    # Chạy khi CI pass và migration thành công hoặc được bỏ qua (không có thay đổi).
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chặn secret lọt vào biến VITE_*
        run: node .github/scripts/check-public-env.mjs --strict

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    name: Deploy to GitHub Pages
    needs: build
    # Mặc định success() xét cả job gián tiếp: migrate bị skip (không có migration mới)
    # sẽ kéo theo job này bị skip dù build đã thành công.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
