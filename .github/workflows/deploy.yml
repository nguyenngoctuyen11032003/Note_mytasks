# Production: push lên main → CI → (migration Supabase nếu có thay đổi) → build → GitHub Pages.
#
# AN TOÀN DATABASE: project Supabase dùng chung với app khác. Workflow này CHỈ chạy
# `supabase db push` (thêm migration chưa áp dụng). Không bao giờ reset / drop /
# `config push` / seed / supabase/maintenance/*.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Chạy bước migration Supabase kể cả khi không có file migration mới
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.migrate }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            result="$FORCE"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            result=true   # nhánh mới / force-push: không so được → kiểm tra (db push tự bỏ qua nếu không có gì mới)
          elif git diff --quiet "$BEFORE" "$AFTER" -- supabase/migrations; then
            result=false
          else
            result=true
          fi
          echo "migrations=$result" >> "$GITHUB_OUTPUT"
          echo "Migration step: $result"

  migrate:
    name: Supabase db push
    needs: [verify, changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tạo environment "production" trong GitHub và bật "Required reviewers"
    # để mỗi lần đổi database phải bấm duyệt.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Check required secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu $v"; missing=1; fi
          done
          exit $missing

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview migrations to apply
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes

  build:
    name: Build site
    needs: [verify, changes, migrate]
    # Chạy khi CI pass và migration thành công hoặc được bỏ qua (không có thay đổi).
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chặn secret lọt vào biến VITE_*
        run: node .github/scripts/check-public-env.mjs --strict

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
